spring:
  application:
    name: ps-everyday
  config:
      import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${ps.db.endpoint}/${ps.db.dbname}?useSSL=false&serverTimezone=Asia/Seoul
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


  mail:
    host: localhost
    port: 8025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          ssl:
            enable: false
          starttls:
            enable: false
  boot:
    admin:
      client:
        url: ${admin-url}

app:
  base-url: ${base-url}

logging:
  level:
    root: INFO
    org.springframework.jdbc.core: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE  # 파라미터까지 자세히
