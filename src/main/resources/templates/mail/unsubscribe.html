<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구독 취소</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body style="font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f7f7fc; color: #212529; line-height: 1.6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; margin: 0;">
<div style="background: white; border-radius: 12px; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); width: 100%; max-width: 500px; overflow: hidden; transition: all 0.3s ease;">
    <div style="padding: 30px; text-align: center; background: linear-gradient(135deg, #4361ee, #7209b7); color: white;">
        <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 10px;"><i class="fas fa-envelope-open-text"></i> PS Everyday 구독 취소</h1>
        <p style="font-size: 16px; opacity: 0.9;">알고리즘 문제 추천 서비스 구독을 취소합니다</p>
    </div>

    <div style="padding: 30px;">
        <div style="background-color: #f8f9fa; border-radius: 8px; padding: 20px; margin-bottom: 25px; text-align: left;">
            <p style="font-size: 16px; color: #333; margin-bottom: 15px;">
                <strong style="color: #4361ee;"><i class="fas fa-info-circle"></i> 안내:</strong> 다음 이메일 주소의 구독을 취소합니다:
            </p>
            <p style="font-size: 18px; color: #28a745; font-weight: bold; padding: 12px; background-color: #e9f5e9; border-radius: 8px; text-align: center; margin: 15px 0;" th:text="${email}">
                example@email.com
            </p>
            <p style="font-size: 15px; color: #6c757d; margin-top: 15px;">
                <i class="fas fa-exclamation-triangle"></i> 구독을 취소하시면 더 이상 알고리즘 문제를 받아보실 수 없습니다.
            </p>
        </div>

        <form action="/unsubscribe" method="post" style="max-width: 400px; margin: 0 auto;">
            <input type="hidden" name="email" th:value="${email}">
            <button type="submit" style="display: inline-block; width: 100%; padding: 12px 24px; background: #dc3545; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.3s ease; text-align: center;">
                <i class="fas fa-times-circle"></i> 구독 취소하기
            </button>
        </form>

        <div style="margin-top: 25px; text-align: center;">
            <a href="/" style="display: inline-block; padding: 10px 20px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; transition: all 0.3s ease;">
                <i class="fas fa-home"></i> 홈으로 돌아가기
            </a>
        </div>
    </div>
</div>
</body>
</html>
