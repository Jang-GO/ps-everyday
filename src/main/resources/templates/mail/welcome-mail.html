<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PS Everyday - 구독 감사</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 60%;
            margin: 30px auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #4CAF50;
        }
        p {
            font-size: 16px;
            color: #333;
        }
        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎉 PS Everyday 구독을 환영합니다! 🎉</h1>
    <p><b><span th:text="${email}"></span></b>님, PS Everyday 구독해 주셔서 감사합니다.</p>
    <p>이제부터 매일 랜덤 알고리즘 문제를 이메일로 받아보실 수 있습니다! 🚀</p>
    <p>문제를 풀며 알고리즘 실력을 키워보세요!</p>
    <div class="footer">
        <p>📩 PS Everyday | 알고리즘 문제 추천 서비스</p>
    </div>
</div>
</body>
</html>
