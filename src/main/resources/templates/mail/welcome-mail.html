<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎉 PS Everyday 구독을 환영합니다!</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body style="font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f7f7fc; color: #212529; line-height: 1.6; margin: 0; padding: 0;">
<div style="width: 90%; max-width: 500px; margin: 30px auto; background: white; padding: 0; border-radius: 12px; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); overflow: hidden;">
    <div style="padding: 30px; text-align: center; background: linear-gradient(135deg, #4361ee, #7209b7); color: white;">
        <h1 style="font-size: 28px; font-weight: 700; margin-bottom: 10px;"><i class="fas fa-stars"></i> PS Everyday 구독을 환영합니다!</h1>
        <p style="font-size: 16px; opacity: 0.9;">매일 알고리즘 문제로 코딩 실력을 향상시키세요</p>
    </div>

    <div style="padding: 30px; text-align: center;">
        <div style="background-color: #f8f9fa; border-radius: 10px; padding: 25px; margin: 0 0 25px;">
            <i class="fas fa-envelope-open-text" style="font-size: 40px; color: #4361ee; margin-bottom: 20px;"></i>
            <p style="font-size: 18px; color: #333; margin-bottom: 5px;">
                <b><span style="color: #4CAF50; font-weight: bold;" th:text="${email}"></span></b>님,
            </p>
            <p style="font-size: 16px; color: #333;">PS Everyday를 구독해 주셔서 감사합니다. 🌟</p>
        </div>

        <div style="margin-bottom: 25px;">
            <div style="display: inline-block; background-color: #e3f2fd; border-radius: 50%; width: 80px; height: 80px; line-height: 80px; margin-bottom: 15px;">
                <i class="fas fa-code" style="font-size: 32px; color: #4361ee;"></i>
            </div>
            <p style="font-size: 16px; color: #333;">이제 매일 랜덤 알고리즘 문제를 이메일로 받아보실 수 있습니다! 🚀</p>
            <p style="font-size: 16px; color: #333;">문제를 풀며 알고리즘 실력을 키워보세요. 최고의 하루 되세요! 😊</p>
        </div>

        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e9ecef; font-size: 14px; color: #6c757d;">
            <p style="font-size: 14px; color: #6c757d;"><i class="fas fa-envelope"></i> PS Everyday | 알고리즘 문제 추천 서비스</p>
            <p style="font-size: 12px; color: #6c757d; margin-top: 10px;">q
                <a th:href="${baseUrl} + '/unsubscribe?email=' + ${email}" style="color: #6c757d; text-decoration: underline;">
                    <i class="fas fa-times-circle"></i> 구독 취소
                </a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
