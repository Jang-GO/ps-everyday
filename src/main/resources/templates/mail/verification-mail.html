<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이메일 인증</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body style="font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f7f7fc; color: #212529; line-height: 1.6; margin: 0; padding: 0;">
<div style="width: 90%; max-width: 500px; margin: 30px auto; background: white; padding: 0; border-radius: 12px; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); overflow: hidden;">
    <div style="padding: 30px; text-align: center; background: linear-gradient(135deg, #4361ee, #7209b7); color: white;">
        <h2 style="font-size: 28px; font-weight: 700; margin-bottom: 10px;"><i class="fas fa-key"></i> 이메일 인증</h2>
        <p style="font-size: 16px; opacity: 0.9;">PS Everyday 서비스 가입을 위한 인증 코드</p>
    </div>

    <div style="padding: 30px; text-align: center;">
        <div style="margin-bottom: 25px;">
            <i class="fas fa-envelope-open-text" style="font-size: 40px; color: #4361ee; margin-bottom: 15px;"></i>
            <p style="font-size: 16px; color: #333;">안녕하세요! <span style="font-weight: bold; color: #4361ee;" th:text="${email}"></span>님,</p>
            <p style="font-size: 16px; color: #333;">아래 인증 코드를 입력하여 이메일 인증을 완료하세요:</p>
        </div>

        <div style="background: #f8f9fa; border: 2px dashed #4361ee; padding: 20px; border-radius: 10px; margin: 20px 0; font-size: 28px; font-weight: bold; color: #4361ee; letter-spacing: 5px;" th:text="${verificationCode}"></div>

        <p style="font-size: 14px; color: #6c757d; margin-top: 20px;">
            <i class="fas fa-clock"></i> 이 인증 코드는 5분 후 만료됩니다.
        </p>

        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e9ecef; font-size: 14px; color: #6c757d;">
            <p style="font-size: 14px; color: #6c757d;"><i class="fas fa-envelope"></i> PS Everyday | 알고리즘 문제 추천 서비스</p>
        </div>
    </div>
</div>
</body>
</html>
