<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>구독자 오류</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body style="font-family: 'Noto Sans KR', sans-serif; background-color: #f7f7fc; color: #212529; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; margin: 0;">
<div style="background: white; border-radius: 12px; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); width: 100%; max-width: 500px; overflow: hidden;">
    <div style="padding: 30px; text-align: center; background: linear-gradient(135deg, #f72585, #7209b7); color: white;">
        <h1 style="font-size: 28px; font-weight: 700;"><i class="fas fa-exclamation-triangle"></i> 구독자 정보 없음</h1>
        <p style="font-size: 16px; opacity: 0.9;">요청한 이메일의 구독자를 찾을 수 없습니다.</p>
    </div>

    <div style="padding: 30px;">
        <div style="background-color: #fff3cd; border-radius: 8px; padding: 20px; color: #856404; margin-bottom: 20px;">
            <i class="fas fa-info-circle"></i> <span th:text="${errorMessage}">에러 메시지 출력 위치</span>
        </div>

        <div style="text-align: center;">
            <a href="/" style="display: inline-block; padding: 12px 24px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 8px; font-size: 15px;">
                <i class="fas fa-home"></i> 홈으로 돌아가기
            </a>
        </div>
    </div>
</div>
</body>
</html>
