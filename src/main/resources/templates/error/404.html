<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>페이지를 찾을 수 없습니다 (404)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
</head>
<body style="font-family: 'Noto Sans KR', sans-serif; background-color: #f7f7fc; color: #212529; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; margin: 0;">
<div style="background: white; border-radius: 12px; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); width: 100%; max-width: 500px; overflow: hidden;">
    <div style="padding: 30px; text-align: center; background: linear-gradient(135deg, #ff7e5f, #feb47b); color: white;">
        <h1 style="font-size: 28px; font-weight: 700; margin-top: 0; margin-bottom: 10px;"><i class="fas fa-map-signs"></i> 404</h1>
        <p style="font-size: 20px; font-weight: 700; margin-bottom: 5px;">페이지를 찾을 수 없습니다.</p>
        <p style="font-size: 16px; opacity: 0.9; margin-bottom: 0;">요청하신 페이지가 존재하지 않거나, 현재 사용할 수 없는 페이지입니다.</p>
    </div>

    <div style="padding: 30px;">
        <div style="background-color: #e9ecef; border-radius: 8px; padding: 20px; color: #495057; margin-bottom: 25px; text-align: center;">
            <i class="fas fa-info-circle" style="margin-right: 8px;"></i>
            <span>입력하신 주소가 정확한지 다시 한번 확인해 주시기 바랍니다.</span>
        </div>

        <div style="text-align: center;">
            <a href="/" style="display: inline-block; padding: 12px 24px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 8px; font-size: 15px; font-weight: bold; transition: background-color 0.3s ease;">
                <i class="fas fa-home" style="margin-right: 8px;"></i> 홈으로 돌아가기
            </a>
        </div>
    </div>
</div>
</body>
</html>
