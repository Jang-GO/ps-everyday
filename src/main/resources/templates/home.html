<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PS Everyday - 매일 알고리즘 문제 추천</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh;">

<div style="background: #ffffff; box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1); border-radius: 10px; padding: 20px; width: 100%; max-width: 400px; text-align: center;">
    <h1 style="color: #007bff; font-size: 24px; font-weight: bold;">📌 PS Everyday</h1>
    <p style="color: #333; font-size: 16px; margin-top: 10px;">매일 알고리즘 문제를 추천받고 싶다면 이메일을 등록하세요!</p>

    <form th:action="@{/subscribe}" method="post" style="margin-top: 20px;">
        <div style="text-align: left; margin-bottom: 15px;">
            <label for="email" style="font-size: 14px; font-weight: bold; color: #333;">이메일</label>
            <input type="email" id="email" name="email" required
                   style="margin-top: 5px; width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; outline: none; box-sizing: border-box;">
        </div>
        <button type="submit"
                style="margin-top: 10px; background: #007bff; color: #ffffff; font-weight: bold; font-size: 14px; padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; transition: background 0.3s;">
            ✅ 구독하기
        </button>
    </form>

    <div th:if="${showVerificationForm}" style="margin-top: 20px;">
        <h3 style="color: #007bff; font-size: 18px; font-weight: bold;">인증 코드 입력</h3>
        <form th:action="@{/verify}" method="post" style="margin-top: 15px;">
            <input type="hidden" name="email" th:value="${email}">
            <div style="text-align: left; margin-bottom: 15px;">
                <label for="verificationCode" style="font-size: 14px; font-weight: bold; color: #333;">인증 코드</label>
                <input type="text" id="verificationCode" name="verificationCode" required
                       style="margin-top: 5px; width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; outline: none; box-sizing: border-box;">
            </div>
            <button type="submit"
                    style="margin-top: 10px; background: #28a745; color: #ffffff; font-weight: bold; font-size: 14px; padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; transition: background 0.3s;">
                인증하기
            </button>
        </form>
    </div>

    <div th:if="${showPreferenceForm}" style="margin-top: 20px;">
        <h3 style="color: #007bff; font-size: 18px; font-weight: bold;">선호도 설정</h3>
        <form th:action="@{/save-preferences}" method="post" style="margin-top: 15px;">
            <input type="hidden" name="email" th:value="${email}">

            <div style="text-align: left; margin-bottom: 15px;">
                <label style="font-size: 14px; font-weight: bold; color: #333;">문제 난이도 범위</label>
                <div style="display: flex; gap: 10px; margin-top: 5px;">
                    <select name="minTier" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px;">
                        <option value="">최소 난이도</option>
                        <option th:each="level : ${problemLevels}"
                                th:value="${level.level}"
                                th:text="${level.name}">
                        </option>
                    </select>
                    <select name="maxTier" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px;">
                        <option value="">최대 난이도</option>
                        <option th:each="level : ${problemLevels}"
                                th:value="${level.level}"
                                th:text="${level.name}">
                        </option>
                    </select>
                </div>
            </div>

            <div style="text-align: left; margin-bottom: 15px;">
                <label style="font-size: 14px; font-weight: bold; color: #333;">선호하는 태그</label>
                <div style="margin-top: 5px; display: flex; flex-wrap: wrap; gap: 5px;">
                    <div th:each="tag : ${availableTags}" style="display: inline-block;">
                        <input type="checkbox" th:id="${tag.id}" th:name="tags" th:value="${tag.id}" style="display: none;">
                        <label th:for="${tag.id}"
                               style="display: inline-block; padding: 5px 10px; border: 1px solid #ccc; border-radius: 15px; cursor: pointer; font-size: 12px;"
                               th:text="${tag.displayName}">
                        </label>
                    </div>
                </div>
            </div>

            <button type="submit"
                    style="margin-top: 10px; background: #28a745; color: #ffffff; font-weight: bold; font-size: 14px; padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; transition: background 0.3s;">
                구독하기
            </button>
        </form>
    </div>

    <div th:if="${message}" th:text="${message}" style="margin-top: 20px; color: #28a745; font-size: 14px; font-weight: bold;"></div>
</div>

<script>
    // 체크박스 스타일링을 위한 스크립트
    document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
        checkbox.addEventListener('change', function() {
            const label = document.querySelector(`label[for="${this.id}"]`);
            if (this.checked) {
                label.style.backgroundColor = '#007bff';
                label.style.color = '#ffffff';
                label.style.borderColor = '#007bff';
            } else {
                label.style.backgroundColor = '';
                label.style.color = '';
                label.style.borderColor = '#ccc';
            }
        });
    });
</script>

</body>
</html>
